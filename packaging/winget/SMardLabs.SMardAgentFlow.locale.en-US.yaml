ShortDescription: A human-led software workflow for coding agents, from discomfort to production.
Description: |-
  SMard Agent Flow is a workflow plugin for coding agents. It accompanies a person from a first
  discomfort to the observed effects of real software in use, and connects creative
  exploration to the tool that runs the tasks. This installer sets it up for Claude Code: it copies the plugin and the
  /smard-agent-flow command into the Claude Code settings folder of the current user.
  Claude Code must already be installed.
